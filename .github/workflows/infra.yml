name: Infra (Terraform)

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: Operacao
        type: choice
        options: [plan, apply]
        default: plan

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: sa-east-1
  TF_VERSION: '1.9.8'
  TF_IN_AUTOMATION: 'true'
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: terraform validate (dev)
        working-directory: infrastructure/terraform/envs/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform validate (prod)
        working-directory: infrastructure/terraform/envs/prod
        run: |
          terraform init -backend=false
          terraform validate

  tflint:
    name: lint + seguranca
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - run: tflint --recursive --chdir=infrastructure/terraform

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform

  plan:
    name: plan (${{ matrix.environment }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-terraform-plan

      - name: terraform init
        working-directory: infrastructure/terraform/envs/${{ matrix.environment }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${LOCK_TABLE}"

      - name: terraform plan
        id: plan
        working-directory: infrastructure/terraform/envs/${{ matrix.environment }}
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          tail -n 60 plan.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: infrastructure/terraform/envs/${{ matrix.environment }}/tfplan
          retention-days: 5

      - name: comentar plan no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### Terraform plan — \`${{ matrix.environment }}\`\n\n<details><summary>ver resumo</summary>\n\n\`\`\`\n${{ toJSON(steps.plan.outputs.summary) }}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  apply:
    name: apply (${{ github.event.inputs.environment || 'dev' }})
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-terraform-apply

      - name: terraform init
        working-directory: infrastructure/terraform/envs/${{ github.event.inputs.environment || 'dev' }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${LOCK_TABLE}"

      # Plan refeito no momento do apply: o artefato pode ter envelhecido
      # enquanto a aprovacao do environment estava pendente.
      - name: terraform apply
        working-directory: infrastructure/terraform/envs/${{ github.event.inputs.environment || 'dev' }}
        run: terraform apply -auto-approve -lock-timeout=5m

      - name: outputs
        working-directory: infrastructure/terraform/envs/${{ github.event.inputs.environment || 'dev' }}
        run: terraform output -json | tee "$GITHUB_STEP_SUMMARY"
