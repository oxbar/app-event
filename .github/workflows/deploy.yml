name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: sa-east-1
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  TF_VERSION: '1.9.8'

jobs:
  # -------------------------------------------------------------------------
  # Le os nomes reais dos recursos direto do state: nada de hardcode.
  # -------------------------------------------------------------------------
  outputs:
    name: Ler outputs do Terraform
    runs-on: ubuntu-latest
    outputs:
      ecr_repository_url: ${{ steps.tf.outputs.ecr_repository_url }}
      ecs_cluster_name: ${{ steps.tf.outputs.ecs_cluster_name }}
      ecs_service_name: ${{ steps.tf.outputs.ecs_service_name }}
      ecs_task_family: ${{ steps.tf.outputs.ecs_task_family }}
      frontend_bucket: ${{ steps.tf.outputs.frontend_bucket }}
      cloudfront_distribution_id: ${{ steps.tf.outputs.cloudfront_distribution_id }}
      app_url: ${{ steps.tf.outputs.app_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-read-outputs

      - id: tf
        working-directory: infrastructure/terraform/envs/${{ env.ENVIRONMENT }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
          terraform output -json > out.json
          for key in ecr_repository_url ecs_cluster_name ecs_service_name ecs_task_family frontend_bucket cloudfront_distribution_id app_url; do
            echo "$key=$(jq -r ".${key}.value" out.json)" >> "$GITHUB_OUTPUT"
          done

  # -------------------------------------------------------------------------
  # Testes: portao antes de qualquer publicacao
  # -------------------------------------------------------------------------
  test-backend:
    name: Testes backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
        working-directory: backend

  test-frontend:
    name: Testes frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend

  # -------------------------------------------------------------------------
  # Backend: imagem -> ECR -> nova task definition -> rollout
  # -------------------------------------------------------------------------
  backend:
    name: Deploy backend
    needs: [outputs, test-backend]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-backend

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ needs.outputs.outputs.ecr_repository_url }}:sha-${{ github.sha }}
            ${{ needs.outputs.outputs.ecr_repository_url }}:${{ env.ENVIRONMENT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Baixar task definition atual
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ needs.outputs.outputs.ecs_task_family }}" \
            --query taskDefinition > task-definition.json

      - name: Trocar a imagem na task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ needs.outputs.outputs.ecr_repository_url }}:sha-${{ github.sha }}

      # O circuit breaker do servico faz rollback sozinho se o Flyway ou o
      # ProductionConfigurationValidator derrubarem as tasks novas.
      - name: Rollout no ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ needs.outputs.outputs.ecs_service_name }}
          cluster: ${{ needs.outputs.outputs.ecs_cluster_name }}
          wait-for-service-stability: true
          wait-for-minutes: 15

  # -------------------------------------------------------------------------
  # Frontend: build -> S3 -> invalidacao
  # -------------------------------------------------------------------------
  frontend:
    name: Deploy frontend
    needs: [outputs, test-frontend, backend]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      - run: npm run build -- --configuration production
        working-directory: frontend

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-frontend

      # Assets com hash no nome: cache longo. HTML e manifests: sem cache.
      - name: Enviar assets imutaveis
        run: |
          aws s3 sync frontend/dist/event-access-frontend/browser \
            "s3://${{ needs.outputs.outputs.frontend_bucket }}" \
            --delete \
            --exclude "index.html" \
            --exclude "*.webmanifest" \
            --exclude "ngsw.json" \
            --exclude "ngsw-worker.js" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Enviar arquivos de entrada
        run: |
          aws s3 sync frontend/dist/event-access-frontend/browser \
            "s3://${{ needs.outputs.outputs.frontend_bucket }}" \
            --exclude "*" \
            --include "index.html" \
            --include "*.webmanifest" \
            --include "ngsw.json" \
            --include "ngsw-worker.js" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidar a CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ needs.outputs.outputs.cloudfront_distribution_id }}" \
            --paths "/index.html" "/ngsw.json" "/ngsw-worker.js" "/*.webmanifest" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ needs.outputs.outputs.cloudfront_distribution_id }}" \
            --id "$ID"

  # -------------------------------------------------------------------------
  # Smoke test pos-deploy
  # -------------------------------------------------------------------------
  smoke:
    name: Smoke test
    needs: [outputs, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      # /actuator so responde dentro da VPC (o ALB usa para health check).
      # Pela borda, validamos o contrato publico de login: 401 significa que a
      # aplicacao subiu, o Flyway rodou e o banco esta acessivel.
      - name: API respondendo
        run: |
          APP="${{ needs.outputs.outputs.app_url }}"
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "$APP/api/auth/login" \
              -H 'Content-Type: application/json' \
              -d '{"email":"smoke-test@invalid.local","password":"invalid"}' || true)
            case "$code" in
              401|400|429) echo "API viva (HTTP $code)"; break ;;
              *) echo "tentativa $i: HTTP $code"; sleep 15 ;;
            esac
          done
          case "$code" in
            401|400|429) ;;
            *) echo "API nao respondeu como esperado (HTTP $code)"; exit 1 ;;
          esac

      - name: SPA sendo servido
        run: |
          APP="${{ needs.outputs.outputs.app_url }}"
          curl -sSf "$APP/" -o /dev/null
          curl -sSf "$APP/login" -o /dev/null
          echo "SPA e deep links OK"
