spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  environment: test
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    access-expiration-seconds: 900
    refresh-expiration-seconds: 604800
  qr:
    secret: test-qr-secret-test-qr-secret-test-qr-secret
  cors:
    allowed-origins: http://localhost:4200
  mail:
    # Nos testes nada sai da JVM: o MailService registra na caixa de saída
    # em memória, que é exatamente o que as asserções inspecionam.
    enabled: false
    from: nao-responda@eventaccess.test
    from-name: Event Access (teste)
  password-reset:
    token-ttl-minutes: 30
    max-requests-per-window: 3
    window-minutes: 15
  reports:
    timezone: America/Sao_Paulo
