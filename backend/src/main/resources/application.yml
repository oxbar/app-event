spring:
  application:
    name: event-access-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/event_access}
    username: ${SPRING_DATASOURCE_USERNAME:event_access}
    password: ${SPRING_DATASOURCE_PASSWORD:event_access}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
server:
  port: 8080
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
app:
  environment: ${APP_ENVIRONMENT:development}
  base-url: ${APP_BASE_URL:http://localhost:4200}
  backend-base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION:604800}
  qr:
    secret: ${QR_SECRET:change-this-qr-secret-change-this-qr-secret-change-this}
  payment-provider: ${PAYMENT_PROVIDER:FAKE}
  asaas:
    base-url: ${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
    api-key: ${ASAAS_API_KEY:}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
    user-agent: ${ASAAS_USER_AGENT:event-access-platform/1.0}
    sandbox: ${ASAAS_SANDBOX:true}
  data-encryption-secret: ${DATA_ENCRYPTION_SECRET:change-this-data-encryption-secret-change-this}
  mail:
    # Em desenvolvimento a stack sobe com o Mailpit (docker compose) e a entrega
    # fica ligada. Sem servidor SMTP, o MailService apenas registra a mensagem.
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:nao-responda@eventaccess.local}
    from-name: ${MAIL_FROM_NAME:Event Access}
    reply-to: ${MAIL_REPLY_TO:}
    subject-prefix: ${MAIL_SUBJECT_PREFIX:}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    max-requests-per-window: ${PASSWORD_RESET_MAX_REQUESTS:3}
    window-minutes: ${PASSWORD_RESET_WINDOW_MINUTES:15}
  reports:
    timezone: ${REPORTS_TIMEZONE:America/Sao_Paulo}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rate-limit:
    max-requests: ${PUBLIC_RATE_LIMIT_MAX:60}
    window-seconds: ${PUBLIC_RATE_LIMIT_WINDOW:60}
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
